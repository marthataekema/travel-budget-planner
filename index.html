<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Budget Planner by CFOMom</title>
<meta name="description" content="Plan your trip budget, track expenses in any currency, split costs, log receipts and estimate tax refunds.">
<meta name="theme-color" content="#0B7A83">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
/* Travel Budget Planner by CFOMom. Layout: boarding-pass header, tab bar (Budget / Struk & Tax Refund / Packing), then a two-column work area that stacks on phones */
:root{
  --paper:#F3F5F4; --card:#FFFFFF; --ink:#13232B; --muted:#5E6E73; --line:#DCE3E1;
  --accent:#0B7A83; --accent-soft:#DDEFEF;
  --ok:#2E8B57; --warn:#C98A00; --bad:#C2413A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A1F; --card:#16252C; --ink:#E6EEEE; --muted:#93A6AA; --line:#28393F;
    --accent:#3FB8C0; --accent-soft:#163A3E; --ok:#4CC28A; --warn:#E3B13B; --bad:#EE6B62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A1F; --card:#16252C; --ink:#E6EEEE; --muted:#93A6AA; --line:#28393F;
  --accent:#3FB8C0; --accent-soft:#163A3E; --ok:#4CC28A; --warn:#E3B13B; --bad:#EE6B62; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:8px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#062126}
.btn.small{padding:4px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:baseline}
.brand h1{font-size:22px}
.save{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pass{display:grid;grid-template-columns:1fr auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pass-main{padding:18px 20px;display:grid;gap:12px}
.route{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.city{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.plane{flex:1;min-width:60px;border-top:2px dashed var(--line);position:relative;height:0}
.plane::after{content:"";position:absolute;right:-2px;top:-6px;border:5px solid transparent;border-left:9px solid var(--accent)}
.meta{display:flex;gap:22px;flex-wrap:wrap}
.meta div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.meta b{font-weight:600}
.stub{border-left:2px dashed var(--line);padding:18px 20px;display:grid;place-content:center;text-align:center;min-width:170px;background:var(--accent-soft)}
.stub .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.stub small{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a .count{font-weight:500;font-size:12px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:22px;font-weight:700}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--bad)} .tile.alert b{color:var(--bad)}
.tile.good b{color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:start}
.stack{display:grid;gap:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .name{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cat .fig{text-align:right;font-size:13px;color:var(--muted)}
.cat .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.cat .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.chip{white-space:nowrap;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.info{color:var(--accent)}
.planinput{width:120px;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
form.add{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.f{display:grid;gap:4px;align-content:start}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}
.conv{font-size:13px;color:var(--muted)}
.receipt-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:10px}
.receipt-box img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.sub{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
svg text{fill:var(--muted);font:11px var(--body)}
.split{display:grid;gap:8px}
.person{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:14px}
.owe{padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.rate{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.rate input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);width:100%}
.catrow{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.catrow input[type=color]{width:36px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.catrow input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);width:100%}
.pgroup{border-top:1px solid var(--line);padding:10px 0}
.pgroup:first-of-type{border-top:0}
.pgroup h3{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.pitem{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:4px 0}
.pitem input{width:18px;height:18px;accent-color:var(--accent)}
.pitem.done span.t{text-decoration:line-through;color:var(--muted)}
.who{font-size:12px;color:var(--muted);padding:0 8px;border-radius:99px;border:1px solid var(--line)}
.meter{position:relative;display:flex}.meter i.planned{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,transparent 4px,transparent 8px);border-radius:0}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut .dl{font-size:11px;fill:var(--muted)}.donut .dv{font:700 16px var(--display);fill:var(--ink)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1;min-width:200px}.legend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.wrow .r{text-align:right;display:grid;gap:2px;justify-items:end}
.exform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.exform .span2x{grid-column:span 3}
.exlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:13px}.exlist li{display:grid;grid-template-columns:60px 1fr auto;gap:8px;align-items:center}
.forbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.forbox legend{font-size:12px;color:var(--muted);padding:0 4px}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer}.pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;padding:0 0 0 6px;text-decoration:underline}
.inline{display:flex;gap:8px;align-items:center}.inline label{white-space:nowrap}.inline input{width:70px}
.span4{grid-column:span 4}.card.editing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
tr.plan td{background:color-mix(in srgb,var(--warn) 7%,transparent)}tr.on td{background:var(--accent-soft)}
td.acts{width:1%}td.acts .btn{display:block;margin-left:auto;white-space:nowrap}tr.dayhead td{background:var(--paper);border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.filters input[type=search]{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--card);padding:5px 12px;font-size:13px}.seg button.on{background:var(--accent);color:#fff}
.fab{position:fixed;right:18px;bottom:18px;z-index:9;border:0;border-radius:99px;padding:14px 20px;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
:root[data-theme="dark"] .fab,:root[data-theme="dark"] .seg button.on{color:#062126}
.wrap{padding-bottom:90px}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.note{font-size:13px;padding:10px 12px;border-left:3px solid var(--warn);background:var(--accent-soft);border-radius:0 8px 8px 0}
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.55);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--card);border-radius:14px;padding:20px;max-width:560px;width:100%;display:grid;gap:12px;max-height:90%;overflow:auto}
.dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialog img{max-width:100%;border-radius:8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:90%}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:900px){.exform{grid-template-columns:1fr 1fr}.exform .span2x{grid-column:1/-1}.span4{grid-column:1/-1}.cols{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}form.add{grid-template-columns:repeat(2,1fr)}.span3,.span4{grid-column:1/-1}.rules{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.pass{grid-template-columns:1fr}.stub{border-left:0;border-top:2px dashed var(--line)}.code{font-size:32px}.dialog .grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.foot{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}.foot p{margin:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.gallery figure{margin:0;display:grid;gap:4px}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.rate.miss input{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--paper))}
.topbar .seg{margin-left:4px}
</style>
</head>

function calc(t){
  var spent=0,planned=0,byCat={},planCat={},byPerson={},share={},byDay={},pre=0;
  t.travellers.forEach(function(p){byPerson[p]=0;share[p]=0});
  t.expenses.forEach(function(e){var v=toHome(e,t);
    if(e.planned){planned+=v;planCat[e.cat]=(planCat[e.cat]||0)+v;return}
    spent+=v;byCat[e.cat]=(byCat[e.cat]||0)+v;byPerson[e.by]=(byPerson[e.by]||0)+v;
    var f=forOf(e,t);f.forEach(function(p){share[p]=(share[p]||0)+v/f.length});
    if(e.date<t.start)pre+=v;else byDay[e.date]=(byDay[e.date]||0)+v});
  var n=days(t),td=today(),dayNo,left;
  if(td<t.start){dayNo=0;left=n}else if(td>t.end){dayNo=n+1;left=0}else{dayNo=Math.round((d(td)-d(t.start))/864e5)+1;left=n-dayNo+1}
  var remain=t.budget-spent-planned,gone=dayNo===0?Object.keys(byDay).length:Math.min(n,dayNo);
  return{spent:spent,planned:planned,remain:remain,byCat:byCat,planCat:planCat,byPerson:byPerson,share:share,byDay:byDay,pre:pre,n:n,dayNo:dayNo,left:left,
    perDayLeft:left>0?remain/left:0,perPerson:spent/Math.max(1,t.travellers.length),avgDay:gone?(spent-pre)/gone:0};
}
function walletCalc(t){
  var w={};t.exchanges.forEach(function(x){var o=w[x.cur]=w[x.cur]||{cur:x.cur,got:0,paid:0,used:0};o.got+=x.got;o.paid+=x.paid});
  t.expenses.forEach(function(e){if(e.planned||e.pay!=="cash"||e.cur===t.home||!w[e.cur])return;w[e.cur].used+=e.amt});
  return Object.keys(w).map(function(k){var o=w[k];o.left=o.got-o.used;o.rate=o.got?o.paid/o.got:0;return o});
}
function taxRule(t){var p=TAX[t.tax.preset]||TAX.CUSTOM,tx=p[L()];return{name:tx[0],minNote:tx[1],how:tx[2],cur:t.tax.cur||p.cur,rate:t.tax.rate!=null?t.tax.rate:p.rate,min:t.tax.min!=null?t.tax.min:p.min,fee:t.tax.fee!=null?t.tax.fee:p.fee,tripMin:p.tripMin||0}}
function taxCalc(t){
  var r=taxRule(t),groups={},other=0;
  t.expenses.forEach(function(e){if(!e.taxfree)return;if(e.cur!==r.cur){other++;return}var st=e.store||T("storeMissing"),k=e.date+"|"+st;(groups[k]=groups[k]||{date:e.date,store:st,items:[],sum:0}).items.push(e);groups[k].sum+=e.amt});
  var list=Object.keys(groups).map(function(k){var g=groups[k];g.ok=g.sum>=r.min;g.tax=g.sum*r.rate/(1+r.rate);g.refund=g.ok?g.tax*(1-r.fee):0;g.short=g.ok?0:r.min-g.sum;return g}).sort(function(a,b){return a.date<b.date?-1:1});
  var okSum=list.reduce(function(s,g){return s+(g.ok?g.sum:0)},0),tripShort=r.tripMin&&okSum<r.tripMin?r.tripMin-okSum:0;
  if(tripShort)list.forEach(function(g){g.refund=0});
  return{rule:r,list:list,refund:list.reduce(function(s,g){return s+g.refund},0),lost:list.reduce(function(s,g){return s+(g.ok?0:g.tax*(1-r.fee))},0),other:other,tripShort:tripShort,eligible:list.filter(function(g){return g.ok}).length};
}
function suggestCat(t,store,desc){

  if(s){var past=t.expenses.slice().reverse().find(function(e){return e.store&&e.store.trim().toLowerCase()===s});if(past&&t.cats.some(function(c){return c.name===past.cat}))return past.cat}

function shrink(file,maxW,q){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var s=Math.min(1,maxW/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL("image/jpeg",q))};img.onerror=function(){URL.revokeObjectURL(u);rej()};img.src=u})}

});
document.addEventListener("submit",function(e){
  e.preventDefault();var t=trip(),f=e.target;

    var msg;

    else{var n=draft.repeat>1?draft.repeat:1;for(var i=0;i<n;i++){var ex2=Object.assign({id:uid(),date:addDays(draft.date,i)},base);if(n>1)ex2.desc=base.desc+" ("+(i+1)+"/"+n+")";if(pending&&i===0)ex2.receipt=pending;t.expenses.push(ex2)}
      msg=n>1?T("savedN",n,fmt(conv(a*n,base.cur,t))):T("savedX",base.desc,fmt(conv(a,base.cur,t)))}

    draft=Object.assign(freshDraft(t),wasEdit?{}:keep);pending=null;persist();toast(msg);

    t.exchanges.push({id:uid(),date:document.getElementById("exDate").value,paid:pd,got:gt,cur:cu,place:document.getElementById("exPlace").value.trim()});persist();toast(T("exLogged",cu,fmtRate(pd/gt)));return}
  if(f.id==="rateForm"){var k=document.getElementById("newCur").value.trim().toUpperCase(),r=num(document.getElementById("newRate").value);
    if(!/^[A-Z]{3}$/.test(k)||isNaN(r)||r<=0){toast(T("codeRateInvalid"));return}t.rates[k]=r;persist();return}

  if(f.id==="catForm"){var nm=document.getElementById("newCatName").value.trim();if(!nm)return;
    if(t.cats.some(function(c){return c.name.toLowerCase()===nm.toLowerCase()})){dialog.err=T("catExists");render();return}
    dialog.err="";t.cats.push({name:nm,color:document.getElementById("newCatColor").value});t.plan[nm]=0;persist();return}
  if(f.id==="tripForm"){
    var g=function(id){var x=document.getElementById(id);return x?x.value.trim():""};
    var st=g("tStart"),en=g("tEnd"),b=num(g("tBudget")),ppl=g("tPeople").split(",").map(function(s){return s.trim()}).filter(function(s,i,a){return s&&a.indexOf(s)===i}),home=dialog.home;

    var data={name:g("tName"),from:g("tFrom").toUpperCase(),fromCity:g("tFromC"),to:g("tTo").toUpperCase(),toCity:g("tToC"),start:st,end:en,budget:b,travellers:ppl};
    if(dialog.mode==="edit"){
      if(home!==t.home){var rH=t.rates[home];if(!(rH>0)){dialog.err=T("errHomeRate",home);render();return}
        var nr={};Object.keys(t.rates).forEach(function(k){nr[k]=t.rates[k]>0?Math.round(t.rates[k]/rH*1e6)/1e6:null});nr[home]=1;t.rates=nr;
        data.budget=Math.round(b/rH*100)/100;Object.keys(t.plan).forEach(function(k){t.plan[k]=Math.round(t.plan[k]/rH*100)/100});t.exchanges.forEach(function(x){x.paid=Math.round(x.paid/rH*100)/100});t.home=home}
      var used={};t.expenses.forEach(function(x){used[x.cur]=1});t.exchanges.forEach(function(x){used[x.cur]=1});var kept=[];

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-lang],[data-edit],[data-paid],[data-delex],[data-userate],[data-logview],[data-addcur],[data-act],[data-del],[data-delrate],[data-view],[data-delpack],[data-tpl],[data-catdel]");
  if(!el){if(e.target.classList&&e.target.classList.contains("overlay")&&dialog&&dialog.mode!=="edit"&&dialog.mode!=="new"){dialog=null;render()}return}
  var t=trip();
  if(el.dataset.lang){S.lang=el.dataset.lang;persist();return}
  if(el.dataset.edit){var ee=t.expenses.find(function(x){return x.id===el.dataset.edit});if(!ee)return;
    draft={trip:t.id,editing:ee.id,date:ee.date,cat:ee.cat,desc:ee.desc,amt:String(ee.amt),cur:ee.cur,by:ee.by,pay:ee.pay,store:ee.store||"",taxfree:!!ee.taxfree,planned:!!ee.planned,for:forOf(ee,t).slice(),repeat:1,catTouched:true};pending=null;
    if(view()!=="budget")location.hash="budget";render();setTimeout(function(){var fc=document.getElementById("formCard");if(fc)fc.scrollIntoView({behavior:"smooth",block:"start"})},0);return}
  if(el.dataset.paid){var pe=t.expenses.find(function(x){return x.id===el.dataset.paid});if(pe){delete pe.planned;persist();toast(T("markedPaid"))}return}

  if(el.dataset.view){dialog={mode:"receipt",id:el.dataset.view};render();return}
  if(el.dataset.del){t.expenses=t.expenses.filter(function(x){return x.id!==el.dataset.del});if(draft&&draft.editing===el.dataset.del)draft=null;persist();toast(T("deleted"));return}
  if(el.dataset.delrate){var k=el.dataset.delrate;if(t.expenses.some(function(x){return x.cur===k})||t.exchanges.some(function(x){return x.cur===k})){toast(T("curInUse",k));return}delete t.rates[k];persist();return}
  if(el.dataset.delpack){e.preventDefault();t.packing=t.packing.filter(function(x){return x.id!==el.dataset.delpack});persist();return}
  if(el.dataset.tpl){var have=t.packing.map(function(x){return x.t.toLowerCase()}),n=0,ix=L()==="id"?2:1;TEMPLATES[el.dataset.tpl].forEach(function(p){if(have.indexOf(p[ix].toLowerCase())<0){t.packing.push({id:uid(),g:p[0],t:p[ix],w:"*",d:false});n++}});persist();toast(T("itemsAdded",n));return}
  if(el.dataset.catdel!=null){var ci=+el.dataset.catdel;if(t.cats.length<=1){dialog.err=T("catMin");render();return}

  var a=el.dataset.act;

  else if(a==="clearsample"){t.expenses=[];t.exchanges=[];t.packing.forEach(function(x){x.d=false});t.sample=false;draft=null;persist()}
  else if(a==="keepsample"){t.sample=false;persist()}
  else if(a==="resetpack"){t.packing.forEach(function(x){x.d=false});persist()}
  else if(a==="copy"){var c=calc(t),tx=taxCalc(t),lines=[t.name+" ("+dateLabel(t.start)+" - "+dateLabel(t.end)+")",T("sumBudget")+": "+fmt(t.budget),T("sumPaid")+": "+fmt(c.spent),T("sumLeft")+": "+fmt(c.remain)];
    t.cats.forEach(function(k){lines.push("- "+k.name+": "+fmt(c.byCat[k.name]||0)+" / "+fmt(+t.plan[k.name]||0))});lines.push(T("sumPP")+": "+fmt(c.perPerson));lines.push(T("sumTax")+": "+fmt(tx.refund,tx.rule.cur));
